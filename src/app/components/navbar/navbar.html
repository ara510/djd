<header class="navbar" [class.scrolled]="scrolled()">
  <div class="container navbar__inner">

    <!-- Logo -->
    <a class="navbar__logo" (click)="scrollTo('hero')">
      <img src="DJD.png" alt="Dujardin Delacour" class="navbar__logo-img" />
    </a>

    <!-- Desktop nav -->
    <nav class="navbar__links" aria-label="Navigation principale">
      <button
        *ngFor="let link of links"
        class="navbar__link"
        [class.active]="activeSection() === link.target"
        (click)="scrollTo(link.target)"
        type="button">
        {{ lang.t(link.key) }}
      </button>

      <!-- Séparateur -->
      <span class="navbar__sep" aria-hidden="true"></span>

      <!-- Bouton galerie -->
      <button class="navbar__gallery-btn" (click)="gallery.open()" type="button" aria-label="Ouvrir la galerie">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>{{ lang.lang() === 'fr' ? 'Photos' : 'Gallery' }}</span>
      </button>

      <span class="navbar__sep" aria-hidden="true"></span>

      <!-- Switcher FR / EN -->
      <div class="navbar__lang">
        <button
          class="navbar__lang-btn"
          [class.active]="lang.lang() === 'fr'"
          (click)="lang.lang.set('fr')"
          type="button">FR</button>
        <span class="navbar__lang-div">|</span>
        <button
          class="navbar__lang-btn"
          [class.active]="lang.lang() === 'en'"
          (click)="lang.lang.set('en')"
          type="button">EN</button>
      </div>

      <span class="navbar__sep" aria-hidden="true"></span>

      <!-- Bouton profil -->
      @if (auth.currentUser()) {
        <button class="navbar__profile-btn navbar__profile-btn--logged" [class.navbar__profile-btn--has-avatar]="!!auth.currentUser()!.avatar" (click)="openProfile.emit()" type="button" [attr.aria-label]="auth.currentUser()!.username">
          @if (auth.currentUser()!.avatar) {
            <img [src]="auth.currentUser()!.avatar!" class="navbar__profile-avatar" [alt]="auth.currentUser()!.username" />
          } @else {
            <span class="navbar__profile-initials">
              {{ auth.currentUser()!.nom[0] }}{{ auth.currentUser()!.prenoms[0] }}
            </span>
          }
        </button>
      } @else {
        <button class="navbar__profile-btn" (click)="openAuth.emit()" type="button" aria-label="Connexion">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      }
    </nav>

    <!-- Mobile burger -->
    <button class="navbar__burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Menu">
      <span class="burger-bar" [class.open]="menuOpen()"></span>
    </button>

  </div>

  <!-- Mobile drawer -->
  <nav class="navbar__drawer" [class.open]="menuOpen()" aria-label="Navigation mobile">
    <button *ngFor="let link of links" class="navbar__drawer-link" (click)="scrollTo(link.target)" type="button">
      {{ lang.t(link.key) }}
    </button>

    <div class="navbar__drawer-row">
      <button class="navbar__drawer-action" (click)="gallery.open(); menuOpen.set(false)" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        {{ lang.lang() === 'fr' ? 'Photos' : 'Gallery' }}
      </button>

      @if (auth.currentUser()) {
        <button class="navbar__drawer-action navbar__drawer-action--accent" (click)="openProfile.emit(); menuOpen.set(false)" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          @{{ auth.currentUser()!.username }}
        </button>
      } @else {
        <button class="navbar__drawer-action navbar__drawer-action--accent" (click)="openAuth.emit(); menuOpen.set(false)" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          {{ lang.lang() === 'fr' ? 'Connexion' : 'Sign in' }}
        </button>
      }

      <div class="navbar__drawer-lang">
        <button class="navbar__lang-btn" [class.active]="lang.lang() === 'fr'" (click)="lang.lang.set('fr')" type="button">FR</button>
        <span class="navbar__lang-div">|</span>
        <button class="navbar__lang-btn" [class.active]="lang.lang() === 'en'" (click)="lang.lang.set('en')" type="button">EN</button>
      </div>
    </div>
  </nav>
</header>

<app-gallery></app-gallery>
