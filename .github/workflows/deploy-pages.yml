name: Déploiement GitHub Pages

# Se déclenche à chaque push sur main (et lançable à la main depuis l'onglet Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits nécessaires au déploiement Pages via GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; annule le précédent s'il est encore en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build (production, base /djd/)
        run: npx ng build --configuration production --base-href /djd/

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/djd/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
