services:
  - type: web
    name: djd-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://ara510.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: djd-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: djd-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: djd-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: djd-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: djd-db
          property: password

databases:
  - name: djd-db
    databaseName: djd_ws_db
    user: djd_user
    plan: free
